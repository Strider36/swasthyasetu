<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SwasthyaSetu Vault</title>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  
  <style>
    body {
      background-color: var(--background);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-premium);
      border-radius: var(--radius-xl);
      padding: 40px;
    }
    
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--primary);
      justify-content: center;
      margin-bottom: 30px;
    }
    
    .auth-logo svg {
      width: 28px;
      height: 28px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2.5;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    
    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 6px;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
    }
    
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="/" class="auth-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-linecap="round"/></svg>
      SwasthyaSetu
    </a>
    
    <div class="auth-header">
      <h2 class="auth-title">Sign in to your Vault</h2>
      <p class="auth-subtitle">Welcome back! Please enter your details below.</p>
    </div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="#" style="font-size: 0.8rem; color: var(--primary); font-weight: 500;" onclick="alert('Demo placeholder: Please register a new account if you have forgotten details.')">Forgot Password?</a>
        </div>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600; margin-top: 8px;">
        Sign In
      </button>
    </form>
    
    <div class="auth-footer">
      Don't have an account? <a href="/register.html">Sign Up</a>
    </div>
  </div>

  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script>
    // Theme alignment helper
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
    }
  </script>
</body>
</html>
