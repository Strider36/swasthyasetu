<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Records - SwasthyaSetu Vault</title>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  
  <style>
    .records-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }

    .filter-tab.active, .filter-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
      background-color: rgba(var(--primary-rgb), 0.04);
    }

    .search-box-wrapper {
      position: relative;
      max-width: 320px;
      width: 100%;
    }

    .search-box-wrapper input {
      padding-left: 36px;
    }

    .search-box-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    .records-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .record-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 200px;
    }

    .record-title {
      font-weight: 600;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .record-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .record-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <div id="app-sidebar" data-active="records"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Navbar -->
      <div id="app-navbar" data-title="Health Records Library" data-subtitle="Upload, search, and category-filter clinical reports, lab analyses, and insurance slips"></div>

      <!-- Page Content -->
      <main class="page-container">
        
        <div class="page-header" style="margin-bottom: 0;">
          <div>
            <h2 class="page-title">Digital Health Locker</h2>
            <p class="page-subtitle">Secure cloud storage for clinical documentation.</p>
          </div>
          <button class="btn btn-primary" id="btn-open-record-modal">
            <i data-lucide="plus"></i> Upload Document
          </button>
        </div>

        <!-- Filter & Search bar row -->
        <div class="records-header-bar">
          <div class="filter-tabs" id="filter-tabs-container">
            <div class="filter-tab active" data-category="All">All Documents</div>
            <div class="filter-tab" data-category="Prescription">Prescriptions</div>
            <div class="filter-tab" data-category="Medical Report">Medical Reports</div>
            <div class="filter-tab" data-category="Lab Result">Lab Results</div>
            <div class="filter-tab" data-category="Bill">Bills</div>
            <div class="filter-tab" data-category="Insurance">Insurance</div>
            <div class="filter-tab" data-category="Other">Others</div>
          </div>

          <div class="search-box-wrapper">
            <i data-lucide="search"></i>
            <input type="text" id="record-search-input" class="form-control" placeholder="Search document name...">
          </div>
        </div>

        <!-- Records Locker Grid -->
        <div class="records-grid" id="records-grid-container">
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 48px;">
            Loading records library...
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Upload Record Modal Dialog -->
  <div class="modal-backdrop" id="record-modal">
    <div class="modal-dialog" style="max-width: 500px;">
      <div class="modal-header">
        <h3 class="modal-title">Upload Clinical Record</h3>
        <button class="modal-close" id="record-modal-close">&times;</button>
      </div>
      
      <form id="record-form">
        <div class="form-group">
          <label for="rec-name" class="form-label">Document Name</label>
          <input type="text" id="rec-name" class="form-control" placeholder="Blood CBC Analysis, Dental Bill" required>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
          <div class="form-group">
            <label for="rec-cat" class="form-label">Category</label>
            <select id="rec-cat" class="form-control" required>
              <option value="Medical Report">Medical Report</option>
              <option value="Lab Result">Lab Result</option>
              <option value="Prescription">Prescription</option>
              <option value="Bill">Bill</option>
              <option value="Insurance">Insurance</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="rec-date" class="form-label">Record Date</label>
            <input type="date" id="rec-date" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="rec-file" class="form-label">Attach File (PDF, Images, DOC)</label>
          <input type="file" id="rec-file" class="form-control" required accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
        </div>

        <div class="form-group">
          <label for="rec-notes" class="form-label">Summary / Notes</label>
          <input type="text" id="rec-notes" class="form-control" placeholder="All parameters normal, follow-up in 6 months">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="record-modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-record-submit">Upload Record</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/records.js"></script>
</body>
</html>
